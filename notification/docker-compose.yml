services:
  notification:
    container_name: notification
    image: hyperf-skeleton
    build:
      dockerfile: dev.Dockerfile
      args:
        UID: 1000
        GID: 1000
    volumes:
      - ./:/opt/www
    ports:
      - 9504:9501
    environment:
      - APP_ENV=dev
      - SCAN_CACHEABLE=false
    networks:
      - notification-internal
      - messaging
    env_file:
      - .env
    develop:
      watch:
        - action: restart
          path: app
    depends_on:
      - postgres-notification
  postgres-notification:
    image: postgres:17
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - notification-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME} -d $${DB_DATABASE}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
networks:
  notification-internal:
    name: notification-internal
    driver: bridge
  messaging:
